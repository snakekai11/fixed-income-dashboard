name: Refresh public market data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '40 3 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '45 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh free public sources
        run: npm run refresh
      - name: Commit verified data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/pbc-omo-history.json data/history
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh public market sources"
          git push
